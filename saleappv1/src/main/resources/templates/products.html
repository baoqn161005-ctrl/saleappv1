<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm</title>
    <style>
        .product-list { display: flex; flex-wrap: wrap; gap: 20px; }
        .product-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 220px; text-align: center; }
        .product-card img { max-width: 100%; height: 150px; object-fit: cover; }
        .price { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>DANH SÁCH SẢN PHẨM</h1>
    <a th:href="@{/}"> Quay lại trang chủ</a>
    <hr>

    <!-- Khung lọc & Tìm kiếm[cite: 4] -->
    <div class="filter-box">
        <form th:action="@{/products}" method="get">
            <!-- Giữ lại categoryId nếu có -->
            <input type="hidden" name="categoryId" th:value="${categoryId}" />

            <label>Từ khóa:</label>
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Nhập tên sản phẩm..." />

            <label>Giá từ:</label>
            <input type="number" name="fromPrice" th:value="${fromPrice}" placeholder="Từ giá" />

            <label>Đến giá:</label>
            <input type="number" name="toPrice" th:value="${toPrice}" placeholder="Đến giá" />

            <button type="submit">Tìm kiếm</button>
            <a th:href="@{/products}">Xóa bộ lọc</a>
        </form>
    </div>

    <!-- Danh sách sản phẩm -->
    <div class="product-list">
        <!-- Lặp qua từng sản phẩm trong danh sách -->
        <div class="product-card" th:each="product : ${products}">
            <!-- Hình ảnh -->
            <a th:href="@{/products/{id}(id=${product.id})}">
                <img th:src="${product.image}" th:alt="${product.name}" />
                <h3 th:text="${product.name}">Tên sản phẩm</h3>
            </a>

            <!-- Mô tả -->
            <p th:text="${product.description}">Mô tả sản phẩm</p>
            
            <!-- Giá sản phẩm -->
            <p class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">Giá</p>
        </div>
    </div>

    <!-- Thông báo nếu không tìm thấy sản phẩm -->
    <div th:if="${#lists.isEmpty(products)}">
        <p>Không tìm thấy sản phẩm phù hợp!</p>
    </div>
    
</body>
</html>
